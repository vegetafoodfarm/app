<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เขาเขียวฟาร์มผัก</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans pb-10">

  <!-- Header -->
  <header class="bg-emerald-600 text-white p-2 shadow-md flex justify-between items-center sticky top-0 z-40">
    <div class="flex items-center space-x-2">
      <i class="fa-solid fa-seedling text-2xl"></i>
      <h1 class="text-lg font-bold">เขาเขียวฟาร์มผัก</h1>
    </div>
    <div class="flex items-center space-x-1">
      <button onclick="openSettingsWithPassword()" class="p-2 text-white hover:bg-emerald-700 rounded-full transition" title="ตั้งค่า">
        <i class="fa-solid fa-gear text-xl"></i>
      </button>
      <button onclick="logout()" class="p-2 text-white hover:bg-emerald-700 rounded-full transition" title="เปลี่ยนผู้ใช้">
        <i class="fa-solid fa-right-from-bracket text-xl"></i>
      </button>
    </div>
  </header>

  <!-- Registration / Login View -->
  <div id="auth-view" class="max-w-md mx-auto m-6 p-6 bg-white rounded-2xl shadow-lg">
    <div class="text-center mb-6">
      <div class="bg-emerald-100 text-emerald-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3">
        <i class="fa-solid fa-user-plus text-2xl"></i>
      </div>
      <h2 class="text-2xl font-bold">ลงทะเบียนผู้ใช้งาน</h2>
      <p class="text-gray-500 text-sm mt-1">กรอกชื่อและรหัสพนักงานสำหรับการเข้าใช้งานครั้งแรก</p>
    </div>
    <form onsubmit="handleRegister(event)" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อพนักงาน (by)</label>
        <input type="text" id="reg-by" required placeholder="เช่น kug" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">รหัสพนักงาน (ID)</label>
        <input type="text" id="reg-id" required placeholder="เช่น W901" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none" />
      </div>
      <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-md transition">
        บันทึกเข้าใช้งาน
      </button>
    </form>
  </div>

  <!-- Main Dashboard Menu View (1-Column Vertical List) -->
  <div id="menu-view" class="max-w-md mx-auto p-4 hidden space-y-1">
    <!-- User info banner -->
    <div class="bg-emerald-600 text-white p-4 rounded-2xl shadow-md flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="bg-white/20 p-1 rounded-xl text-2xl">🌱</div>
        <div>
          <!-- <div class="text-xl font-bold">เขาเขียวฟาร์มผัก</div>-->
          <div class="text-sm text-emerald-100">ผู้ใช้: <span id="user-display">--</span></div>
        </div>
      </div>
      <div class="text-right">
        <div class="text-xs text-emerald-200 font-bold">วันที่</div>
        <div class="text-sm font-medium" id="date-display">--/--/----</div>
      </div>
    </div>

    <h3 class="text-lg font-bold text-slate-700 px-1">เลือกรายการทำงาน</h3>

    <!-- 5 Big Vertical Stacked Cards -->
    <div class="grid grid-cols-1 gap-1">

      <!-- 1) ปลูก -->
      <button onclick="openForm('ปลูก', 'sprout', 'bg-emerald-500')" class="bg-white p-2 rounded-xl shadow-md border-2 border-emerald-500 hover:bg-emerald-50 text-left flex items-center space-x-4 active:scale-98 transition">
        <div class="bg-emerald-500 text-white w-10 h-10 rounded-xl flex items-center justify-center text-xl shadow-sm shrink-0">
          🌱
        </div>
        <div>
          <div class="text-xl font-extrabold text-slate-800">1) ปลูก</div>
          <div class="text-xs text-slate-500">บันทึกการลงแปลงปลูกผัก</div>
        </div>
      </button>

      <!-- 2) เติมปุ๋ย -->
      <button onclick="openForm('เติมปุ๋ย', 'flask', 'bg-blue-500')" class="bg-white p-2 rounded-xl shadow-md border-2 border-blue-500 hover:bg-blue-50 text-left flex items-center space-x-4 active:scale-98 transition">
        <div class="bg-blue-500 text-white w-10 h-10 rounded-xl flex items-center justify-center text-xl shadow-sm shrink-0">
          🧪
        </div>
        <div>
          <div class="text-xl font-extrabold text-slate-800">2) เติมปุ๋ย</div>
          <div class="text-xs text-slate-500">บันทึกค่าวัดและปริมาณปุ๋ย</div>
        </div>
      </button>

      <!-- 3) ใส่ยา -->
      <button onclick="openForm('ใส่ยา', 'tablets', 'bg-purple-500')" class="bg-white p-2 rounded-xl shadow-md border-2 border-purple-500 hover:bg-purple-50 text-left flex items-center space-x-4 active:scale-98 transition">
        <div class="bg-purple-500 text-white w-10 h-10 rounded-xl flex items-center justify-center text-xl shadow-sm shrink-0">
          💊
        </div>
        <div>
          <div class="text-xl font-extrabold text-slate-800">3) ใส่ยา</div>
          <div class="text-xs text-slate-500">บันทึกการใส่ยาและอายุด้านแปลง</div>
        </div>
      </button>

      <!-- 4) ฉีดใบ -->
      <button onclick="openForm('ฉีดใบ', 'spray-can', 'bg-amber-500')" class="bg-white p-2 rounded-xl shadow-md border-2 border-amber-500 hover:bg-amber-50 text-left flex items-center space-x-4 active:scale-98 transition">
        <div class="bg-amber-500 text-white w-10 h-10 rounded-xl flex items-center justify-center text-xl shadow-sm shrink-0">
          🚿
        </div>
        <div>
          <div class="text-xl font-extrabold text-slate-800">4) ฉีดใบ</div>
          <div class="text-xs text-slate-500">บันทึกการฉีดทางใบ</div>
        </div>
      </button>

      <!-- 5) เก็บเกี่ยว -->
      <button onclick="openForm('เก็บเกี่ยว', 'basket-shopping', 'bg-rose-500')" class="bg-white p-2 rounded-xl shadow-md border-2 border-rose-500 hover:bg-rose-50 text-left flex items-center space-x-4 active:scale-98 transition">
        <div class="bg-rose-500 text-white w-10 h-10 rounded-xl flex items-center justify-center text-xl shadow-sm shrink-0">
          🧺
        </div>
        <div>
          <div class="text-xl font-extrabold text-slate-800">5) เก็บเกี่ยว</div>
          <div class="text-xs text-slate-500">บันทึกจำนวนผลผลิตที่เก็บเกี่ยว</div>
        </div>
      </button>

    </div>
  </div>

  <!-- Dynamic Form View -->
  <div id="form-view" class="max-w-md mx-auto p-4 hidden">
    <div class="bg-white rounded-2xl shadow-lg overflow-hidden border border-slate-200">
      
      <!-- Form Header -->
      <div id="form-header" class="p-4 text-white flex justify-between items-center">
        <div class="flex items-center space-x-3">
          <span id="form-icon-container" class="text-2xl"></span>
          <h2 id="form-title" class="text-2xl font-bold">--</h2>
        </div>
        <button onclick="showMenuView()" class="bg-white/20 hover:bg-white/30 text-white px-3 py-1 rounded-lg text-sm font-bold">
          ✕ ปิด
        </button>
      </div>

      <!-- Auto-filled / Editable Metadata Box -->
      <div class="bg-slate-50 p-4 border-b text-xs grid grid-cols-2 gap-2 text-slate-600 items-center">
        <div>
          <strong class="text-slate-800 block mb-1">วันที่ทำ:</strong> 
          <input type="date" id="input-date" class="p-1.5 border rounded-lg bg-white text-xs font-bold text-emerald-700 w-full focus:ring-1 focus:ring-emerald-500 focus:outline-none" />
        </div>
        <div>
        <!--  <strong class="text-slate-800 block mb-1">เวลาที่บันทึก (datetime):</strong> 
          <span id="auto-datetime" class="font-medium text-slate-700 text-sm">--</span> -->
        </div>
        <div><strong class="text-slate-800">ประเภท (cate):</strong> <span id="auto-cate" class="font-bold text-emerald-600">--</span></div>
        <div><strong class="text-slate-800">ผู้บันทึก (by):</strong> <span id="auto-by" class="font-bold text-emerald-600">--</span></div>
      </div>

      <!-- Dynamic Form Inputs -->
      <form onsubmit="handleFormSubmit(event)" class="p-4 space-y-4">
        
        <div id="field-bed" class="form-field">
          <label class="block text-sm font-bold text-slate-700 mb-1">แปลง (bed)</label>
          <input type="text" id="input-bed" placeholder="เช่น 1A, 1B, 2C" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none" />
        </div>

        <div id="field-qty" class="form-field">
          <label class="block text-sm font-bold text-slate-700 mb-1">จำนวน (qty)</label>
          <input type="number" step="any" id="input-qty" placeholder="เช่น 20, 50, 100" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none" />
        </div>

        <div id="field-type" class="form-field">
          <label class="block text-sm font-bold text-slate-700 mb-1">ประเภท/ชนิด (type)</label>
          <input type="text" id="input-type" placeholder="เช่น สลัด, คื่นฉ่าย, a, d" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none" />
        </div>

        <div id="field-tank_no" class="form-field">
          <label class="block text-sm font-bold text-slate-700 mb-1">ถัง/เลขถัง (tank no)</label>
          <input type="text" id="input-tank_no" placeholder="เช่น 1, 46296-T001" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none" />
        </div>

        <div id="field-age" class="form-field">
          <label class="block text-sm font-bold text-slate-700 mb-1">อายุ (age)</label>
          <input type="number" id="input-age" placeholder="เช่น 11" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none" />
        </div>

        <!-- Fertilizer fields -->
        <div id="field-fert" class="form-field grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">ปุ๋ยก่อน (fert_bef)</label>
            <input type="number" step="any" id="input-fert_bef" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">ปุ๋ยหลัง (fert_aft)</label>
            <input type="number" step="any" id="input-fert_aft" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none" />
          </div>
        </div>

        <div id="field-ph" class="form-field">
          <label class="block text-sm font-bold text-slate-700 mb-1">pH</label>
          <input type="number" step="0.1" id="input-ph" placeholder="เช่น 5.5, 6.0" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none" />
        </div>

        <div id="field-level" class="form-field grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">ระดับก่อน (level_bef)</label>
            <input type="number" step="any" id="input-level_bef" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">ระดับหลัง (level_aft)</label>
            <input type="number" step="any" id="input-level_aft" class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none" />
          </div>
        </div>

        <button type="submit" id="submit-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-xl shadow-lg transition text-lg mt-4">
          บันทึกข้อมูล
        </button>
      </form>
    </div>
  </div>

  <!-- Password-Protected Settings Modal -->
  <div id="settings-modal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="text-xl font-bold text-slate-800">ตั้งค่าระบบ (Settings)</h3>
        <button onclick="closeSettingsModal()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">✕</button>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1">Google Apps Script Web App URL</label>
          <input type="url" id="setting-url" placeholder="https://script.google.com/macros/s/.../exec" class="w-full p-3 border rounded-xl text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none" />
        </div>

        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1">เปลี่ยนรหัสผ่านตั้งค่า (Admin Password)</label>
          <input type="password" id="setting-password" placeholder="ใส่รหัสผ่านใหม่ที่นี่ (ค่าเริ่มต้น: 1234)" class="w-full p-3 border rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none" />
        </div>
      </div>

      <div class="pt-4 flex space-x-2">
        <button onclick="saveSettings()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl">
          บันทึก
        </button>
        <button onclick="closeSettingsModal()" class="bg-gray-200 hover:bg-gray-300 text-slate-700 font-bold px-5 py-3 rounded-xl">
          ยกเลิก
        </button>
      </div>
    </div>
  </div>

  <script>
    let activeCategory = '';

    window.addEventListener('DOMContentLoaded', () => {
      checkAuth();
      updateDateDisplay();
    });

    function getAdminPassword() {
      return localStorage.getItem('farm_admin_password') || '1234';
    }

    function openSettingsWithPassword() {
      const currentPassword = getAdminPassword();
      const userInput = prompt('กรุณากรอกรหัสผ่านเพื่อเข้าสู่หน้าตั้งค่า (Default: 1234):');
      
      if (userInput === null) return;

      if (userInput === currentPassword) {
        document.getElementById('setting-url').value = localStorage.getItem('farm_script_url') || '';
        document.getElementById('setting-password').value = currentPassword;
        document.getElementById('settings-modal').classList.remove('hidden');
      } else {
        alert('รหัสผ่านไม่ถูกต้อง (Incorrect Password)');
      }
    }

    function closeSettingsModal() {
      document.getElementById('settings-modal').classList.add('hidden');
    }

    function saveSettings() {
      const url = document.getElementById('setting-url').value.trim();
      const newPassword = document.getElementById('setting-password').value.trim();

      if (url) {
        localStorage.setItem('farm_script_url', url);
      }
      if (newPassword) {
        localStorage.setItem('farm_admin_password', newPassword);
      }

      alert('บันทึกการตั้งค่าเรียบร้อยแล้ว');
      closeSettingsModal();
    }

    function checkAuth() {
      const userBy = localStorage.getItem('farm_user_by');
      if (userBy) {
        document.getElementById('auth-view').classList.add('hidden');
        document.getElementById('menu-view').classList.remove('hidden');
        document.getElementById('user-display').innerText = userBy;
      } else {
        document.getElementById('auth-view').classList.remove('hidden');
        document.getElementById('menu-view').classList.add('hidden');
      }
    }

    function handleRegister(e) {
      e.preventDefault();
      const byVal = document.getElementById('reg-by').value.trim();
      const idVal = document.getElementById('reg-id').value.trim();

      if (byVal && idVal) {
        localStorage.setItem('farm_user_by', byVal);
        localStorage.setItem('farm_user_id', idVal);
        checkAuth();
      }
    }

    function logout() {
      if (confirm('คุณต้องการเปลี่ยนผู้ใช้งานใช่หรือไม่?')) {
        localStorage.removeItem('farm_user_by');
        localStorage.removeItem('farm_user_id');
        checkAuth();
      }
    }

    function updateDateDisplay() {
      const now = new Date();
      document.getElementById('date-display').innerText = formatDateToDisplay(now);
    }

    function formatDateToDisplay(d) {
      const day = String(d.getDate()).padStart(2, '0');
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const year = d.getFullYear();
      return `${day}/${month}/${year}`;
    }

    function formatDateTime(d) {
      const datePart = formatDateToDisplay(d);
      const hrs = String(d.getHours()).padStart(2, '0');
      const mins = String(d.getMinutes()).padStart(2, '0');
      return `${datePart} ${hrs}:${mins}`;
    }

    function openForm(cate, icon, bgClass) {
      activeCategory = cate;
      const now = new Date();
      const userBy = localStorage.getItem('farm_user_by') || '';

      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      document.getElementById('input-date').value = `${yyyy}-${mm}-${dd}`;

      document.getElementById('auto-datetime').innerText = formatDateTime(now);
      document.getElementById('auto-cate').innerText = cate;
      document.getElementById('auto-by').innerText = userBy;

      const header = document.getElementById('form-header');
      header.className = `p-4 text-white flex justify-between items-center ${bgClass}`;
      document.getElementById('form-title').innerText = cate;

      const emojiMap = {
        'ปลูก': '🌱',
        'เติมปุ๋ย': '🧪',
        'ใส่ยา': '💊',
        'ฉีดใบ': '🚿',
        'เก็บเกี่ยว': '🧺'
      };
      document.getElementById('form-icon-container').innerText = emojiMap[cate] || '📝';

      document.querySelectorAll('.form-field').forEach(el => el.classList.add('hidden'));

      if (cate === 'ปลูก') {
        showFields(['bed', 'qty', 'type', 'tank_no']);
      } else if (cate === 'เติมปุ๋ย') {
        showFields(['bed', 'qty', 'type', 'fert', 'ph', 'level']);
      } else if (cate === 'ใส่ยา') {
        showFields(['bed', 'qty', 'type', 'tank_no', 'age']);
      } else if (cate === 'ฉีดใบ') {
        showFields(['bed', 'qty', 'type', 'tank_no']);
      } else if (cate === 'เก็บเกี่ยว') {
        showFields(['bed', 'qty', 'type']);
      }

      document.getElementById('menu-view').classList.add('hidden');
      document.getElementById('form-view').classList.remove('hidden');
    }

    function showFields(fieldIds) {
      fieldIds.forEach(id => {
        const el = document.getElementById(`field-${id}`);
        if (el) el.classList.remove('hidden');
      });
    }

    function showMenuView() {
      document.getElementById('form-view').classList.add('hidden');
      document.getElementById('menu-view').classList.remove('hidden');
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.innerText = 'กำลังบันทึก...';

      const now = new Date();
      const userBy = localStorage.getItem('farm_user_by') || '';

      const rawDateVal = document.getElementById('input-date').value;
      let formattedDate = formatDateToDisplay(now);
      if (rawDateVal) {
        const parts = rawDateVal.split('-');
        if (parts.length === 3) {
          formattedDate = `${parts[2]}/${parts[1]}/${parts[0]}`;
        }
      }

      const payload = {
        date: formattedDate,
        datetime: formatDateTime(now),
        cate: activeCategory,
        by: userBy,
        bed: document.getElementById('input-bed')?.value || '',
        qty: document.getElementById('input-qty')?.value || '',
        type: document.getElementById('input-type')?.value || '',
        tank_no: document.getElementById('input-tank_no')?.value || '',
        age: document.getElementById('input-age')?.value || '',
        fert_bef: document.getElementById('input-fert_bef')?.value || '',
        fert_aft: document.getElementById('input-fert_aft')?.value || '',
        ph: document.getElementById('input-ph')?.value || '',
        level_bef: document.getElementById('input-level_bef')?.value || '',
        level_aft: document.getElementById('input-level_aft')?.value || ''
      };

      const scriptUrl = localStorage.getItem('farm_script_url');

      if (scriptUrl) {
        try {
          await fetch(scriptUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          alert('บันทึกข้อมูลเรียบร้อยแล้ว!');
          clearFormInputs();
          showMenuView();
        } catch (err) {
          alert('เกิดข้อผิดพลาดในการส่งข้อมูล: ' + err.message);
        }
      } else {
        alert('บันทึกข้อมูลในเครื่องเรียบร้อย (ยังไม่ได้ตั้งค่า Google Apps Script URL)');
        clearFormInputs();
        showMenuView();
      }

      submitBtn.disabled = false;
      submitBtn.innerText = 'บันทึกข้อมูล';
    }

    function clearFormInputs() {
      document.querySelectorAll('#form-view input:not([type="date"])').forEach(i => i.value = '');
    }
  </script>
</body>
</html>
