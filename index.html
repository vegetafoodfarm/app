//-----------------saperater-----------------------//

    let activeCategory = '';
    let bedList = [];
    let vegList = [];
    let chemList = [];

  window.addEventListener('DOMContentLoaded', () => {
  checkAuth();
  updateDateDisplay();
  loadMasterData();
});





//-----------------saperater-----------------------//

async function loadMasterData() {
  const scriptUrl = localStorage.getItem('farm_script_url');
  if (!scriptUrl) return;

  try {
    const response = await fetch(scriptUrl);
    const data = await response.json();

    bedList = data.beds || [];
    vegList = data.vegetables || [];
    chemList = data.chemicals || [];

    // Cache all lists in localStorage for offline fallback
    localStorage.setItem('farm_master_data', JSON.stringify(data));
  } catch (err) {
    console.error('Error loading master data:', err);
    const cached = localStorage.getItem('farm_master_data');
    if (cached) {
      const parsed = JSON.parse(cached);
      bedList = parsed.beds || [];
      vegList = parsed.vegetables || [];
      chemList = parsed.chemicals || [];
    }
  }
}



//-----------------saperater-----------------------//



function updateBedDropdown() {
  const selectedHouse = document.getElementById('input-house').value;
  const wrapper = document.getElementById('bed-input-wrapper');
  const isMulti = (activeCategory === 'พ่นปุ๋ย' || activeCategory === 'พ่นยา'|| activeCategory === 'เพาะ');

  const filteredBeds = bedList.filter(item => item.house === selectedHouse);

  if (isMulti) {
    // แสดงผลแบบ Checkboxes หลายตัวเลือก (สำหรับ พ่นปุ๋ย / พ่นยา)
    if (filteredBeds.length === 0) {
      wrapper.innerHTML = '<div class="text-xs text-gray-400 p-1">ไม่พบแปลงในโรงนี้</div>';
      return;
    }
    let html = '<div class="max-h-32 overflow-y-auto border rounded-lg p-1.5 bg-white space-y-1 text-xs">';
    filteredBeds.forEach(item => {
      html += `<label class="flex items-center space-x-2 cursor-pointer hover:bg-slate-50 p-1 rounded">
                 <input type="checkbox" name="multi-bed" value="${item.bed}" class="rounded text-emerald-600 focus:ring-emerald-500">
                 <span>${item.bed}</span>
               </label>`;
    });
    html += '</div>';
    wrapper.innerHTML = html;
  } else {
    // แสดงผลแบบ Dropdown เลือกอันเดียว (สำหรับ ปลูก, เติมปุ๋ย, ย้าย / เก็บเกี่ยว)
    let html = '<select id="input-bed" class="w-full p-1 border rounded-lg bg-white text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none"><option value="" disabled selected>เลือกแปลง...</option>';
    filteredBeds.forEach(item => {
      html += `<option value="${item.bed}">${item.bed}</option>`;
    });
    html += '</select>';
    wrapper.innerHTML = html;
  }
}



//-----------------saperater-----------------------//


    function getAdminPassword() {
      return localStorage.getItem('farm_admin_password') || '1234';
    }



//-----------------saperater-----------------------//

    function openSettingsWithPassword() {
      const currentPassword = getAdminPassword();
      const userInput = prompt('กรุณากรอกรหัสผ่านเพื่อเข้าสู่หน้าตั้งค่า (Default: 1234):');
      
      if (userInput === null) return;

      if (userInput === currentPassword) {
        document.getElementById('setting-url').value = localStorage.getItem('farm_script_url') || '';
        document.getElementById('setting-password').value = currentPassword;
        document.getElementById('settings-modal').classList.remove('hidden');
      } else {
        alert('รหัสผ่านไม่ถูกต้อง (Incorrect Password)');
      }
    }


//-----------------saperater-----------------------//


    function closeSettingsModal() {
      document.getElementById('settings-modal').classList.add('hidden');
    }


//-----------------saperater-----------------------//

    function saveSettings() {
      const url = document.getElementById('setting-url').value.trim();
      const newPassword = document.getElementById('setting-password').value.trim();

      if (url) {
        localStorage.setItem('farm_script_url', url);
      }
      if (newPassword) {
        localStorage.setItem('farm_admin_password', newPassword);
      }

      alert('บันทึกการตั้งค่าเรียบร้อยแล้ว');
      closeSettingsModal();
    }


//-----------------saperater-----------------------//


    function checkAuth() {
      const userBy = localStorage.getItem('farm_user_by');
      if (userBy) {
        document.getElementById('auth-view').classList.add('hidden');
        document.getElementById('menu-view').classList.remove('hidden');
        document.getElementById('user-display').innerText = userBy;
      } else {
        document.getElementById('auth-view').classList.remove('hidden');
        document.getElementById('menu-view').classList.add('hidden');
      }
    }



//-----------------saperater-----------------------//


    function handleRegister(e) {
      e.preventDefault();
      const byVal = document.getElementById('reg-by').value.trim();
      const idVal = document.getElementById('reg-id').value.trim();

      if (byVal && idVal) {
        localStorage.setItem('farm_user_by', byVal);
        localStorage.setItem('farm_user_id', idVal);
        checkAuth();
      }
    }


//-----------------saperater-----------------------//


    function logout() {
      if (confirm('คุณต้องการเปลี่ยนผู้ใช้งานใช่หรือไม่?')) {
        localStorage.removeItem('farm_user_by');
        localStorage.removeItem('farm_user_id');
        checkAuth();
      }
    }


//-----------------saperater-----------------------//


    function updateDateDisplay() {
      const now = new Date();
      document.getElementById('date-display').innerText = formatDateToDisplay(now);
    }


//-----------------saperater-----------------------//


    function formatDateToDisplay(d) {
      const day = String(d.getDate()).padStart(2, '0');
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const year = d.getFullYear();
      return `${day}/${month}/${year}`;
    }



//-----------------saperater-----------------------//


    function formatDateTime(d) {
      const datePart = formatDateToDisplay(d);
      const hrs = String(d.getHours()).padStart(2, '0');
      const mins = String(d.getMinutes()).padStart(2, '0');
      return `${datePart} ${hrs}:${mins}`;
    }



//-----------------saperater-----------------------//


    function openForm(cate, icon, bgClass) {
      activeCategory = cate;
      const now = new Date();
      const userBy = localStorage.getItem('farm_user_by') || '';

      const yyyy = now.getFullYear();
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      document.getElementById('input-date').value = `${yyyy}-${mm}-${dd}`;

      document.getElementById('auto-datetime').innerText = formatDateTime(now);
      document.getElementById('auto-cate').innerText = cate;
      document.getElementById('auto-by').innerText = userBy;

      const header = document.getElementById('form-header');
      header.className = `p-4 text-white flex justify-between items-center ${bgClass}`;
      document.getElementById('form-title').innerText = cate;

      const emojiMap = {
        'เพาะ': '🫘',
        'ปลูก': '🌱',
        'เติมปุ๋ย': '🧪',
        'พ่นยา': '💊',
        'พ่นปุ๋ย': '🚿',
        'ย้าย / เก็บเกี่ยว': '🧺'
      };
      document.getElementById('form-icon-container').innerText = emojiMap[cate] || '📝';

      document.querySelectorAll('.form-field').forEach(el => el.classList.add('hidden'));


      if (cate === 'เพาะ') {
        showFields(['bed', 'type','qty', 'note']);
      } else if (cate === 'ปลูก') {
        showFields(['bed', 'type','qty', 'tank_no', 'note']);
      } else if (cate === 'เติมปุ๋ย') {
        showFields(['bed', 'type', 'qty', 'fert', 'ph', 'level', 'note']);
      } else if (cate === 'พ่นยา') {
        showFields(['bed', 'type','tank_no', 'note']);
      } else if (cate === 'พ่นปุ๋ย') {
        showFields(['bed', 'type', 'tank_no', 'note']);
      } else if (cate === 'ย้าย / เก็บเกี่ยว') {
        showFields(['bed', 'qty', 'type', 'note']);
      }

      document.getElementById('menu-view').classList.add('hidden');
      document.getElementById('form-view').classList.remove('hidden');
    }



//-----------------saperater-----------------------//


    function showFields(fieldIds) {
      fieldIds.forEach(id => {
        const el = document.getElementById(`field-${id}`);
        if (el) el.classList.remove('hidden');
      });
    }



//-----------------saperater-----------------------//


    function showMenuView() {
      document.getElementById('form-view').classList.add('hidden');
      document.getElementById('menu-view').classList.remove('hidden');
    }



//-----------------saperater-----------------------//



    async function handleFormSubmit(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.innerText = 'กำลังบันทึก...';

      const now = new Date();
      const userBy = localStorage.getItem('farm_user_by') || '';

      const rawDateVal = document.getElementById('input-date').value;
      let formattedDate = formatDateToDisplay(now);
      if (rawDateVal) {
        const parts = rawDateVal.split('-');
        if (parts.length === 3) {
          formattedDate = `${parts[2]}/${parts[1]}/${parts[0]}`;
        }
      }

	// ตรวจสอบว่าหน้างานเป็นแบบเลือกหลายอันหรือไม่
  const isMulti = (activeCategory === 'พ่นปุ๋ย' || activeCategory === 'พ่นยา');
  let bedValue = '';

  if (isMulti) {
    const checkedBeds = Array.from(document.querySelectorAll('input[name="multi-bed"]:checked')).map(cb => cb.value);
    bedValue = checkedBeds.join(', '); // รวมแปลงที่เลือกด้วยเครื่องหมายคอมมา
  } else {
    bedValue = document.getElementById('input-bed')?.value || '';
  }

  const payload = {
    date: formattedDate,
    datetime: formatDateTime(now),
    cate: activeCategory,
    by: userBy,
    house: document.getElementById('input-house')?.value || '',
    bed: bedValue, // ใช้ค่าที่รวมแล้วส่งเข้า Google Sheets คอลัมน์ E
    qty: document.getElementById('input-qty')?.value || '',
    type: document.getElementById('input-type')?.value || '',
    tank_no: document.getElementById('input-tank_no')?.value || '',
    age: document.getElementById('input-age')?.value || '',
    fert_bef: document.getElementById('input-fert_bef')?.value || '',
    fert_aft: document.getElementById('input-fert_aft')?.value || '',
    ph: document.getElementById('input-ph')?.value || '',
    level_bef: document.getElementById('input-level_bef')?.value || '',
    level_aft: document.getElementById('input-level_aft')?.value || '',
    note: document.getElementById('input-note')?.value || ''
  };

      const scriptUrl = localStorage.getItem('farm_script_url');

      if (scriptUrl) {
        try {
          await fetch(scriptUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          alert('บันทึกข้อมูลเรียบร้อยแล้ว!');
          clearFormInputs();
          showMenuView();
        } catch (err) {
          alert('เกิดข้อผิดพลาดในการส่งข้อมูล: ' + err.message);
        }
      } else {
        alert('บันทึกข้อมูลในเครื่องเรียบร้อย (ยังไม่ได้ตั้งค่า Google Apps Script URL)');
        clearFormInputs();
        showMenuView();
      }

      submitBtn.disabled = false;
      submitBtn.innerText = 'บันทึกข้อมูล';
    }


//-----------------saperater-----------------------//


function clearFormInputs() {
  document.querySelectorAll('#form-view input:not([type="date"])').forEach(i => i.value = '');

  const houseSelect = document.getElementById('input-house');
  if (houseSelect) houseSelect.selectedIndex = 0;

  const bedWrapper = document.getElementById('bed-input-wrapper');
  if (bedWrapper) {
    bedWrapper.innerHTML = `<select id="input-bed" class="w-full p-1 border rounded-lg bg-white text-xs focus:ring-2 focus:ring-emerald-500 focus:outline-none">
      <option value="" disabled selected>เลือกโรงก่อน...</option>
    </select>`;
  }
}
